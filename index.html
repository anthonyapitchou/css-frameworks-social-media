<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>FrameWork Social Media</title>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-gray-100">
    <div
      class="relative w-full max-w-xs rounded-xl border border-gray-200 bg-white p-6 shadow-md"
    >
      <!-- Menu button -->
      <button class="absolute top-3 right-3 rounded-lg p-2 hover:bg-gray-100">
        ⋮
      </button>

      <!-- Profile content -->
      <div class="flex flex-col items-center">
        <img
          class="mb-4 h-24 w-24 rounded-full object-cover"
          src="../img/profile-picture-3.jpg"
          alt="Profile image"
        />

        <h2 class="text-xl font-semibold text-gray-900">Bonnie Green</h2>

        <p class="mb-4 text-gray-500">Visual Designer</p>

        <p class="mb-6 text-center text-sm text-gray-600">
          Open-source contributor & CEO. Building amazing products for designers
          and developers.
        </p>

        <!-- Followers -->
        <div class="mb-6 flex gap-6 text-sm">
          <div class="text-center">
            <p class="font-bold text-gray-900">758</p>
            <p class="text-gray-500">Followers</p>
          </div>

          <div class="text-center">
            <p class="font-bold text-gray-900">120</p>
            <p class="text-gray-500">Following</p>
          </div>

          <div class="text-center">
            <p class="font-bold text-gray-900">34</p>
            <p class="text-gray-500">Posts</p>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-3">
          <button
            class="rounded-lg bg-blue-500 px-4 py-2 text-white hover:bg-blue-600"
          >
            Follow
          </button>

          <button
            class="rounded-lg border border-gray-300 px-4 py-2 hover:bg-gray-100"
          >
            Message
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
