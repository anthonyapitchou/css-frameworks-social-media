<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>FrameWork Social Media</title>
  </head>
  <body class="flex min-h-screen items-center justify-center bg-gray-100">
    <div class="flex w-full max-w-3xl gap-8 px-4">
      <!-- LOGIN -->
      <div class="w-full rounded-xl bg-white p-8 shadow-md">
        <h1 class="mb-6 text-center text-2xl font-bold text-gray-800">
          Welcome back
        </h1>
        <form action="../feed/index.html">
          <div class="mb-5">
            <label
              for="login-email"
              class="mb-2 block text-sm font-medium text-gray-700"
            >
              Your email
            </label>
            <input
              type="email"
              id="login-email"
              placeholder="name@example.com"
              required
              class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2.5 text-sm text-gray-900 shadow-sm placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="mb-5">
            <label
              for="login-password"
              class="mb-2 block text-sm font-medium text-gray-700"
            >
              Your password
            </label>
            <input
              type="password"
              id="login-password"
              placeholder="••••••••"
              required
              minlength="8"
              class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2.5 text-sm text-gray-900 shadow-sm placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <button
            type="submit"
            class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition-all hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 focus:outline-none"
          >
            Login
          </button>
        </form>
      </div>

      <!-- REGISTER -->
      <div class="w-full rounded-xl bg-white p-8 shadow-md">
        <h1 class="mb-6 text-center text-2xl font-bold text-gray-800">
          Create account
        </h1>
        <form action="../feed/index.html">
          <div class="mb-5">
            <label
              for="register-name"
              class="mb-2 block text-sm font-medium text-gray-700"
            >
              Your name
            </label>
            <input
              type="text"
              id="register-name"
              placeholder="John Doe"
              required
              class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2.5 text-sm text-gray-900 shadow-sm placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="mb-5">
            <label
              for="register-email"
              class="mb-2 block text-sm font-medium text-gray-700"
            >
              Your email
            </label>
            <input
              type="email"
              id="register-email"
              placeholder="name@example.com"
              required
              class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2.5 text-sm text-gray-900 shadow-sm placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="mb-5">
            <label
              for="register-password"
              class="mb-2 block text-sm font-medium text-gray-700"
            >
              Your password
            </label>
            <input
              type="password"
              id="register-password"
              placeholder="••••••••"
              required
              minlength="8"
              class="w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2.5 text-sm text-gray-900 shadow-sm placeholder:text-gray-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <label
            for="remember"
            class="mb-5 flex cursor-pointer items-center gap-2"
          >
            <input
              id="remember"
              type="checkbox"
              required
              class="h-4 w-4 rounded border border-gray-300 bg-gray-50 focus:ring-2 focus:ring-blue-500"
            />
            <span class="text-sm text-gray-700">
              I agree with the
              <a href="#" class="text-blue-600 hover:underline"
                >terms and conditions</a
              >
            </span>
          </label>

          <button
            type="submit"
            class="w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm transition-all hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 focus:outline-none"
          >
            Register
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
